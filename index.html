<script>
(function () {

  var frame = document.getElementById('gym-frame');

  // Fallback: if resize message never arrives, keep min-height 100vh (already set via CSS).

    // Validate message shape; origin validation is limited because Apps Script

    if (msg.height > 0) {
      frame.style.height = msg.height + 'px';
    }
  }, false);
})();
